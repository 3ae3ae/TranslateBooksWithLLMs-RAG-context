[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "translatebook"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "flask-socketio",
    "python-socketio",
    "requests",
    "tqdm",
    "httpx",
    "lxml",
    "python-dotenv",
    "aiofiles>=22.0,<25.0",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "langdetect>=1.0.9",
    "Pillow>=10.0.0",
    # DOCX support
    "mammoth>=1.0.0",
    "python-docx>=1.1.0",
]

[project.scripts]
tbl = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
